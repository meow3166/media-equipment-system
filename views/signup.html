<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>회원가입</title>

    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="/assets/css/register.css">
</head>

<body>

    <main class="register-page">

        <section class="register-container">

            <div class="register-logo">
                <h1>회원가입</h1>
                <p>영화방송학과 기자재 대여 시스템</p>
            </div>

            {% if errorMessage %}
            <div class="register-message register-error">
                {{ errorMessage }}
            </div>
            {% endif %}

            <form action="/auth/signup" method="post">

                <div class="register-group">
                    <label for="login_id">
                        학번
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="login_id"
                        name="login_id"
                        value="{{ registerData.login_id or '' }}"
                        placeholder="학번을 입력하세요"
                        inputmode="numeric"
                        maxlength="20"
                        required
                    >
                </div>

                <div class="register-group">
                    <label for="user_name">
                        이름
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="user_name"
                        name="user_name"
                        value="{{ registerData.user_name or '' }}"
                        placeholder="이름을 입력하세요"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="register-group">
                    <label for="phone">
                        연락처
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        value="{{ registerData.phone or '' }}"
                        placeholder="010-0000-0000"
                        maxlength="30"
                    >
                </div>

                <div class="register-group">
                    <label for="email">
                        이메일
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ registerData.email or '' }}"
                        placeholder="example@email.com"
                        maxlength="100"
                    >
                </div>

                <div class="register-group">
                    <label for="password">
                        비밀번호
                        <span class="required">*</span>
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="8자 이상 입력하세요"
                        minlength="8"
                        required
                    >
                </div>

                <div class="register-group">
                    <label for="password_confirm">
                        비밀번호 확인
                        <span class="required">*</span>
                    </label>

                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        placeholder="비밀번호를 다시 입력하세요"
                        minlength="8"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="register-btn"
                >
                    가입 신청
                </button>

            </form>

            <div class="register-links">
                <a href="/auth/login">
                    로그인으로 돌아가기
                </a>
            </div>

        </section>

    </main>

</body>

</html>
