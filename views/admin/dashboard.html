{% include "includes/admin-layout-top.html" %}

<main class="admin-content">
    <section class="summary-grid">
        <article class="summary-card pending">
            <span class="summary-label">승인 대기</span>
            <strong>{{ pendingCount }}</strong>
            <a href="/admin/users/pending">승인 관리 바로가기</a>
        </article>

        <article class="summary-card active">
            <span class="summary-label">승인 회원</span>
            <strong>{{ activeCount }}</strong>
            <span>현재 이용 가능한 학생 계정</span>
        </article>

        <article class="summary-card total">
            <span class="summary-label">전체 회원</span>
            <strong>{{ totalCount }}</strong>
            <span>학생 계정 전체</span>
        </article>
    </section>

    <section class="admin-panel">
        <div class="panel-header">
            <div>
                <h2>회원가입 승인 관리</h2>
                <p>승인을 기다리고 있는 회원을 확인할 수 있습니다.</p>
            </div>

            <a href="/admin/users/pending" class="primary-button">
                승인 대기 목록
            </a>
        </div>
    </section>
</main>

{% include "includes/admin-layout-bottom.html" %}
